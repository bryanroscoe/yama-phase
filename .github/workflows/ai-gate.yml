name: Private bounded Clippy memory diagnostic

on:
  workflow_dispatch:

concurrency:
  group: private-bounded-clippy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  clippy-memory-control:
    if: github.repository == 'bryanroscoe/yama-phase' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, saget-ci]
    timeout-minutes: 360
    steps:
      - name: Wait for saget CI capacity
        working-directory: ${{ runner.temp }}
        run: |
          test "${SAGET_CI_SLOT_PROTOCOL:-}" = step-v1
          python3 /run/saget-ci/slot.py --step
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/prepare-private-ci
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
          cache: false
      - name: Verify unchanged accepted PR source and allocator support
        run: |
          set -euo pipefail
          BASE=7c2f15af2c188b0947b6eaaed9a91bc86c24b272
          test "$(git rev-parse HEAD^)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- crates Cargo.toml Cargo.lock .cargo protocol data
          mkdir "$RUNNER_TEMP/clippy-memory-control"
          git rev-parse HEAD > "$RUNNER_TEMP/clippy-memory-control/source.txt"
          # Verify the installed compiler recognizes every allocator option.
          MALLOC_CONF=confirm_conf:true,abort_conf:true,dirty_decay_ms:0,muzzy_decay_ms:0,narenas:1 clippy-driver --version 2> "$RUNNER_TEMP/clippy-memory-control/allocator-confirmation.txt"
          grep -q 'Set conf value: dirty_decay_ms:0' "$RUNNER_TEMP/clippy-memory-control/allocator-confirmation.txt"
          grep -q 'Set conf value: muzzy_decay_ms:0' "$RUNNER_TEMP/clippy-memory-control/allocator-confirmation.txt"
          grep -q 'Set conf value: narenas:1' "$RUNNER_TEMP/clippy-memory-control/allocator-confirmation.txt"
      - name: Run unchanged full Clippy command with bounded allocator experiment
        id: clippy
        continue-on-error: true
        env:
          MALLOC_CONF: abort_conf:true,dirty_decay_ms:0,muzzy_decay_ms:0,narenas:1
        run: |
          test "${CARGO_BUILD_JOBS:-}" = 1
          python3 scripts/bounded-clippy-diagnostic.py --report "$RUNNER_TEMP/clippy-memory-control/summary.json" -- cargo clippy --locked --workspace --exclude phase-tauri --all-targets --features engine/proptest -- -D warnings
      - name: Preserve memory diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-clippy-memory-control
          retention-days: 7
          path: ${{ runner.temp }}/clippy-memory-control/
      - name: Report completion on the tracked PR
        continue-on-error: true
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        with:
          script: |
            const fs = require('fs');
            const file = `${process.env.RUNNER_TEMP}/clippy-memory-control/summary.json`;
            const summary = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'No compiler measurement; inspect logs.';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({...context.repo, issue_number: 8,
              body: `Bounded Clippy memory diagnostic completed: ${process.env.CLIPPY_OUTCOME || 'not run'}. Same PR8 engine/AI/compiler/flags, experimental compiler allocator reclamation only. No required-check pass or baseline claim. [Run and evidence](${url}).\n\n` + '```json\n' + summary + '\n```'});
      - name: Preserve diagnostic verdict
        if: always() && steps.clippy.outcome != 'success'
        run: exit 1
