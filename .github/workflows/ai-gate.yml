name: Private main cold perf budget

on:
  workflow_dispatch:

concurrency:
  group: private-main-cold-perf-budget-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  perf-control:
    if: github.repository == 'bryanroscoe/yama-phase' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, saget-ci]
    timeout-minutes: 360
    steps:
      - name: Wait for saget CI capacity
        working-directory: ${{ runner.temp }}
        run: |
          test "${SAGET_CI_SLOT_PROTOCOL:-}" = step-v1
          python3 /run/saget-ci/slot.py --step
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/prepare-private-ci
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: '1.98.1'
          cache: false
      - name: Verify exact private-main source and policy
        run: |
          set -euo pipefail
          BASE=dd276b0f626c868f43804d0d0cd300d8e7369fbf
          test "$(git rev-parse HEAD^)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- crates Cargo.toml Cargo.lock .cargo protocol data
          mkdir -p target/perf-cold-budget
          {
            git rev-parse HEAD
            ./scripts/engine-source-hash.sh "$BASE"
            rustc -Vv
            cargo -V
          } > target/perf-cold-budget/source.txt
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/ai_perf_budget_tests.py -v
      - name: Download the verified candidate evidence
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const artifact_id = 13038697563;
            const {data: a} = await github.rest.actions.getArtifact({...context.repo, artifact_id});
            if (a.expired || a.name !== 'private-main-perf-repeatability' ||
                a.workflow_run.id !== 41166781983 ||
                a.workflow_run.head_sha !== '1ac3aa26f86ee6c5f9d5731e725bd5c7876864dd') {
              throw new Error('Repeatability artifact provenance mismatch');
            }
            const zip = await github.rest.actions.downloadArtifact({...context.repo, artifact_id, archive_format: 'zip'});
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/perf-repeatability.zip`, Buffer.from(zip.data));
      - name: Verify candidate identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/prior-perf-repro"
          unzip -q "$RUNNER_TEMP/perf-repeatability.zip" -d "$RUNNER_TEMP/prior-perf-repro"
          candidate="$RUNNER_TEMP/prior-perf-repro/target/perf-repro/perf-baseline.json"
          echo "87fbeb7776d73c51afd731fce60557a9149307b46dc0ae6f40ad39146c75549f  $candidate" | sha256sum -c -
          cp "$candidate" target/perf-cold-budget/candidate-baseline.json
          cp "$RUNNER_TEMP/prior-perf-repro/target/perf-repro/summary.json" target/perf-cold-budget/prior-summary.json
      - name: Restore source-matched AI card data
        id: card-data-cache
        uses: ./.github/actions/ai-card-data-cache
      - name: Check the unchanged MTGJSON input
        run: |
          echo '05212c5919104ed44d4f5968ad9e5873228b9ad7f4eb2de83bb246a2465b5b9b  data/mtgjson/AtomicCards.json' | sha256sum -c -
      - name: Generate source-matched card data on a cache miss
        if: steps.card-data-cache.outputs.cardgen-cache-hit != 'true'
        run: |
          cargo run --profile tool --features cli --bin oracle-gen -- data/ --stats --names-out data/card-names.json > data/card-data.json
      - name: Prepare one disposable cold target
        run: |
          set -euo pipefail
          # The persistent compiler cache is not copied, restored or modified.
          df -h "$RUNNER_TEMP" /ci-cache/target
          du -sh /ci-cache/target
          available=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          test "$available" -ge 41943040
          target=$(mktemp -d "$RUNNER_TEMP/phase-perf-cold.XXXXXX")
          echo "PERF_COLD_TARGET=$target" >> "$GITHUB_ENV"
          printf '%s\n' "$target" > target/perf-cold-budget/disposable-target.txt
          sha256sum data/mtgjson/AtomicCards.json data/card-data.json > target/perf-cold-budget/input-sha256.txt
      - name: Measure genuinely cold build and unchanged gate
        id: cold
        continue-on-error: true
        run: |
          set -euo pipefail
          test -z "$(find "$PERF_COLD_TARGET" -mindepth 1 -print -quit)"
          test "${CARGO_BUILD_JOBS:-}" = 1
          build_start=$(date +%s)
          # A build reaching 60m cannot pass the build-plus-gate rule.
          CARGO_TARGET_DIR="$PERF_COLD_TARGET" timeout --signal=TERM --kill-after=60s 3600s cargo build --locked --profile server-release --bin ai-perf-gate
          build_seconds=$(( $(date +%s) - build_start ))
          echo "$build_seconds" > target/perf-cold-budget/build-seconds.txt
          BIN="$PERF_COLD_TARGET/server-release/ai-perf-gate"
          start=$(date +%s)
          "$BIN" --baseline "$PWD/target/perf-cold-budget/candidate-baseline.json" --current-output target/perf-cold-budget/current.json > target/perf-cold-budget/comparison.md
          elapsed=$(( $(date +%s) - start ))
          echo "$elapsed" > target/perf-cold-budget/run-seconds.txt
          du -sh "$PERF_COLD_TARGET" > target/perf-cold-budget/target-size.txt
          python3 - "$build_seconds" "$elapsed" <<'PY_VERIFY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path('target/perf-cold-budget')
          candidate = json.loads((root/'candidate-baseline.json').read_text())
          current = json.loads((root/'current.json').read_text())
          prior = json.loads((root/'prior-summary.json').read_text())
          assert prior['validation_runs'] == 25 and prior['band_fail'] == 0 and prior['margin_rc'] == 0
          assert prior['input_verification'] == 'success'
          for field in ('schema_version', 'card_data_hash', 'base_seed', 'action_cap', 'sample_count', 'scenarios', 'counters'):
              assert current[field] == candidate[field], field
          assert len(current['counters']) == 45
          assert current['git_sha'] == os.environ['GITHUB_SHA'][:12]
          run_seconds = max(int(sys.argv[2]), prior['max_run_seconds'])
          result = subprocess.run(['python3', 'scripts/ai-perf-budget.py', '--build-seconds', sys.argv[1],
                                   '--max-run-seconds', str(run_seconds)], capture_output=True, text=True)
          budget = json.loads(result.stdout)
          assert budget['budget_seconds'] == 3600
          summary = dict(**budget, cold_target='new empty mktemp directory; no compiled cache restore',
                         input_verification='success', all_45_counters_identical=True,
                         reused_repeatability_run=41166781983, validation_runs=25,
                         baseline_committed=False, candidate_only=True)
          (root/'summary.json').write_text(json.dumps(summary, indent=2)+'\n')
          print(json.dumps(summary, indent=2))
          sys.exit(result.returncode)
          PY_VERIFY
      - name: Clean only this job's disposable compiler output
        if: always() && env.PERF_COLD_TARGET != ''
        run: |
          set -euo pipefail
          case "$PERF_COLD_TARGET" in "$RUNNER_TEMP"/phase-perf-cold.*) ;; *) exit 1 ;; esac
          test -d "$PERF_COLD_TARGET" && test ! -L "$PERF_COLD_TARGET"
          cargo clean --target-dir "$PERF_COLD_TARGET"
          if [ -d "$PERF_COLD_TARGET" ]; then rmdir "$PERF_COLD_TARGET"; fi
          test ! -e "$PERF_COLD_TARGET"
          rm -f "$RUNNER_TEMP/perf-repeatability.zip"
          df -h "$RUNNER_TEMP"
      - name: Preserve cold-build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-main-cold-perf-budget
          retention-days: 7
          path: target/perf-cold-budget/
      - name: Report completion on the tracked PR
        continue-on-error: true
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          COLD_OUTCOME: ${{ steps.cold.outcome }}
        with:
          script: |
            const fs = require('fs');
            const file = 'target/perf-cold-budget/summary.json';
            const summary = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'No completed cold-build proof; inspect logs.';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({...context.repo, issue_number: 8,
              body: `Private-main cold perf budget completed: ${process.env.COLD_OUTCOME || 'not run'}. Exact private-main engine dd276b0f626c868f43804d0d0cd300d8e7369fbf; diagnostic ${context.sha}. Approved private-saget budget 60m; hosted/upstream retain 25m. Baseline remains uncommitted. [Run and evidence](${url}).\n\n` +
                '```json\n' + summary + '\n```'});
      - name: Preserve cold-budget verdict
        if: always() && steps.cold.outcome != 'success'
        run: exit 1
