name: Private main perf control

on:
  workflow_dispatch:

concurrency:
  group: private-main-perf-control-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  perf-control:
    if: github.repository == 'bryanroscoe/yama-phase' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, saget-ci-perf-control]
    timeout-minutes: 360
    steps:
      - name: Wait for saget CI capacity
        working-directory: ${{ runner.temp }}
        run: |
          test "${SAGET_CI_SLOT_PROTOCOL:-}" = step-v1
          python3 /run/saget-ci/slot.py --step
      - name: Report diagnostic capacity admission
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: 8,
              body: `Private-main perf control has acquired saget capacity. Restore the normal saget-ci label on runner 2 and remove saget-ci-perf-control; queued tests can resume after this diagnostic. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/prepare-private-ci
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: '1.98.1'
          cache: false
      - name: Verify exact private-main code
        run: |
          set -euo pipefail
          BASE=dd276b0f626c868f43804d0d0cd300d8e7369fbf
          test "$(git rev-parse HEAD^)" = "$BASE"
          git diff --exit-code "$BASE" HEAD -- crates Cargo.toml Cargo.lock .cargo protocol data
          git rev-parse HEAD > perf-control-source.txt
          ./scripts/engine-source-hash.sh "$BASE" >> perf-control-source.txt
      - name: Retrieve benchmark input for fingerprint verification
        run: |
          mkdir -p data
          curl -fSL --retry 3 --max-time 180 https://data.phase-rs.dev/preview/card-data.json -o data/card-data.json
          test -s data/card-data.json
      - name: Run unchanged perf workload on private main
        id: perf
        continue-on-error: true
        run: |
          cargo ai-perf-gate --current-output target/perf-control-current.json > target/perf-control-report.md
      - name: Verify matching scenario input
        id: provenance
        if: always()
        run: |
          python3 - <<'PY'
          import json
          with open('target/perf-control-current.json') as f:
              report = json.load(f)
          assert report['card_data_hash'] == 'cea608c514890427e9d9ddc39536155d56f8ea31'
          assert report['base_seed'] == 2654435769
          assert report['action_cap'] == 3000
          assert report['sample_count'] == 5
          PY
      - name: Preserve control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-main-perf-control
          retention-days: 7
          path: |
            perf-control-source.txt
            target/perf-control-current.json
            target/perf-control-report.md
      - name: Report control completion on the tracked PR
        continue-on-error: true
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          PERF_OUTCOME: ${{ steps.perf.outcome }}
          INPUT_OUTCOME: ${{ steps.provenance.outcome }}
        with:
          script: |
            const fs = require('fs');
            let table = 'No completed benchmark report; inspect the control run logs.';
            if (fs.existsSync('target/perf-control-report.md')) {
              table = fs.readFileSync('target/perf-control-report.md', 'utf8').slice(0, 16000);
            }
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo, issue_number: 8,
              body: `Private-main performance control completed: ${process.env.PERF_OUTCOME || 'not run'}; input fingerprint verification: ${process.env.INPUT_OUTCOME || 'not run'}.\n\n` +
                `Reference engine/AI code: dd276b0f626c868f43804d0d0cd300d8e7369fbf; diagnostic commit: ${context.sha}. ` +
                `Comparison target is PR head 7c2f15af2c188b0947b6eaaed9a91bc86c24b272, Rust 1.98.1, seed 2654435769, action cap 3000, five samples. Only accept results if input verification passes (the same 46-card fingerprint as that head). ` +
                `This is diagnostic evidence, not a waiver or baseline refresh. [Run and artifacts](${url}).\n\n${table}`,
            });
      - name: Preserve the benchmark verdict
        if: always() && steps.perf.outcome != 'success'
        run: exit 1
